<style>
  :root{
    color-scheme:light dark;
    --ink:#211E1B;
    --paper:#F5EFE3;
    --accent:#6B3F4B;
    --accent-soft:rgba(107,63,75,.12);
    --muted:#70695E;
  }

  @media (prefers-color-scheme:dark){
    :root{
      --ink:#EDE5D6;
      --paper:#181511;
      --accent:#DBA6B6;
      --accent-soft:rgba(219,166,182,.16);
      --muted:#9C9280;
    }
  }

  *{ box-sizing:border-box; }
  ::selection{
    background:var(--accent-soft);
    color:var(--ink);
  }
  html,body{ margin:0; min-height:100%; }
  body{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',-apple-system,sans-serif;
  }

  main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 24px 40px;
    text-align:center;
  }

  .hero{
    width:min(620px,100%);
  }

  .mark{
    display:block;
    width:54px;
    height:auto;
    margin:0 auto 24px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:440;
    font-size:clamp(38px,6vw,58px);
    letter-spacing:.005em;
    margin:0 0 18px;
  }

  .thesis{
    color:var(--accent);
    font-family:'Fraunces',serif;
    font-weight:440;
    font-size:clamp(25px,4vw,34px);
    line-height:1.25;
    margin:0 0 18px;
  }

  .lede{
    max-width:46ch;
    margin:0 auto;
    color:var(--muted);
    font-size:16px;
    line-height:1.65;
  }

  footer{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:0 24px 28px;
    color:var(--muted);
    font-size:12.5px;
  }

  .company-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  .company-link{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:6px;
    opacity:1;
    transition:transform .15s ease,background-color .15s ease;
  }

  .company-link:hover,
  .company-link:focus-visible{
    background:var(--accent-soft);
    transform:translateY(-1px);
  }

  .company-link:active{
    transform:translateY(0);
  }

  .company-link:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .company-link img{
    display:block;
    max-width:28px;
    max-height:28px;
    width:auto;
    height:auto;
  }

  .company-link.trevra img{
    width:28px;
    height:28px;
  }
  @media (max-width:560px){
    main{ padding:44px 22px 32px; }
    footer{ padding-bottom:22px; }
  }

  @media (prefers-reduced-motion:reduce){
    .company-link{ transition:none; }
    .company-link:hover{ transform:none; }
  }
</style>

<body>
  <main>
    <section class="hero" aria-labelledby="olaryn-title">
      <img class="mark" src="/logo-mark.svg?v=8" width="501" height="493" alt="">

      <h1 id="olaryn-title">Olaryn</h1>
      <p class="thesis">Learning compounds.</p>
      <p class="lede">What we learn, improve, and create should strengthen everything around it.</p>
    </section>
  </main>

  <footer>
    <nav class="company-links" aria-label="Olaryn companies">
      <a class="company-link beseam" href="https://beseam.com" target="_blank" rel="noopener" aria-label="beseam">
        <img src="/assets/companies/beseam.svg?v=3" alt="">
      </a>
      <a class="company-link" href="https://lemoncrow.com" target="_blank" rel="noopener" aria-label="lemoncrow">
        <img src="/assets/companies/lemoncrow.svg" alt="">
      </a>
      <a class="company-link trevra" href="https://usetrevra.com" target="_blank" rel="noopener" aria-label="usetrevra">
        <img src="/assets/companies/trevra.svg?v=2" alt="">
      </a>
    </nav>
    <div>&copy; 2026 Olaryn · Zürich, Switzerland 🇨🇭</div>
  </footer>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card template</title>
<!-- Renders the 1200x630 social cards (og-image.png and assets/og/*.png). Run: node scripts/render-og-cards.mjs -->
<style>
  @font-face { font-family: "Inter"; font-weight: 400 600; src: url("/assets/fonts/inter-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F9FAFB; color: #000000;
    font-family: "Inter", sans-serif; letter-spacing: .015em; font-feature-settings: "ss07" 1, "ss08" 1, "liga" 0; }
  .card { box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; width: 1200px; height: 630px; padding: 72px 88px; }
  .brand { display: flex; align-items: center; gap: 16px; font: 450 34px/1 "Inter", sans-serif; letter-spacing: 0; }
  .brand svg { width: 52px; height: 52px; color: #000000; --paper: #F9FAFB; }
  h1 { margin: 0; font: 400 76px/1.15 "Inter", sans-serif; letter-spacing: 0; }
  h1 span { display: block; color: #6A7282; }
  .foot { display: flex; justify-content: space-between; padding-top: 28px; border-top: 2px solid #E5E7EB; font: 450 24px/1 "Inter", sans-serif; color: #5F6877; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><svg aria-hidden="true"><use id="mark"></use></svg><span id="name"></span></div>
  <h1><span id="line1"></span><span id="line2"></span></h1>
  <div class="foot"><span id="under"></span><span>olaryn.com</span></div>
</div>
<script>
  const cards = {
    home: { mark: "olaryn", name: "Olaryn", l1: "Learning compounds.", l2: "", under: "What we learn, improve, and create should strengthen everything around it." },
    auth: { mark: "zikela", name: "Zikela", l1: "Meet Zikela", l2: "Sign-in for your app", under: "Passkeys · Email links · Google · GitHub" },
    billing: { mark: "bilyra", name: "Bilyra", l1: "Meet Bilyra", l2: "Fair billing for usage and credits", under: "Subscriptions · Credits · Usage · Refunds" },
    analytics: { mark: "yeleva", name: "Yeleva", l1: "Meet Yeleva", l2: "Analytics for Olaryn products", under: "Visits · Actions · Usage" }
  };
  const c = cards[new URLSearchParams(location.search).get("p")] || cards.home;
  document.getElementById("mark").setAttribute("href", "/assets/marks.svg?v=2#" + c.mark);
  document.getElementById("name").textContent = c.name;
  document.getElementById("line1").textContent = c.l1;
  document.getElementById("line2").textContent = c.l2;
  document.getElementById("under").textContent = c.under;
</script>
</body>
</html>

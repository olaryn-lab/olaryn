<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card template</title>
<!-- Renders the 1200x630 social cards in assets/og/. Usage: see README ("Social cards"). -->
<style>
  @font-face { font-family: "Fraunces"; font-weight: 340 500; src: url("/assets/fonts/fraunces-latin.woff2") format("woff2"); }
  @font-face { font-family: "Work Sans"; font-weight: 400 600; src: url("/assets/fonts/worksans-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #f5efe3; color: #211e1b; overflow: hidden; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 84px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #dcd0c1; }
  .brand { display: flex; align-items: center; gap: 18px; font: 600 30px "Work Sans", sans-serif; letter-spacing: -.03em; }
  .brand img { width: 56px; height: 56px; }
  .brand small { display: block; font: 500 16px "Work Sans", sans-serif; color: #645e58; letter-spacing: .02em; margin-top: 4px; }
  h1 { margin: 0; font: 440 88px/1.06 "Fraunces", serif; letter-spacing: -.04em; max-width: 960px; }
  h1 em { font-style: normal; color: #6b3f4b; }
  .foot { font: 500 20px "Work Sans", sans-serif; color: #645e58; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img id="mark" alt=""><div><span id="name"></span><small id="sub"></small></div></div>
  <h1 id="headline"></h1>
  <div class="foot">olaryn.com</div>
</div>
<script>
  const cards = {
    authward: { mark: "/assets/authward-mark.svg", name: "authward", sub: "by Olaryn", html: "Identity is infrastructure. <em>Your product is the experience.</em>" },
    billing: { mark: "/assets/billing-mark.svg", name: "olaryn/billing", sub: "Shared commercial infrastructure", html: "One place for revenue. <em>One truth for credits.</em>" }
  };
  const c = cards[new URLSearchParams(location.search).get("p")] || cards.authward;
  document.getElementById("mark").src = c.mark;
  document.getElementById("name").textContent = c.name;
  document.getElementById("sub").textContent = c.sub;
  document.getElementById("headline").innerHTML = c.html;
</script>
</body>
</html>

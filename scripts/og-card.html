<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card template</title>
<!-- Renders the 1200x630 social cards: assets/og/authward.png, assets/og/billing.png and og-image.png (?p=home). Usage: see README ("Social cards"). -->
<style>
  @font-face { font-family: "Archivo"; font-weight: 400 800; font-stretch: 75% 125%; src: url("/assets/fonts/archivo-latin.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 700; src: url("/assets/fonts/jetbrainsmono-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0e10; color: #e8ebed; font-family: "Archivo", sans-serif; }
  .frame { position: absolute; inset: 40px; display: grid; grid-template-rows: 72px 1fr; gap: 1px; background: #262d33; border: 1px solid #262d33; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #12161a; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-stretch: 88%; font-size: 30px; letter-spacing: -.005em; }
  .brand img { width: 36px; height: 36px; }
  .brand small { font-weight: 500; font-stretch: 100%; font-size: 17px; color: #9aa5ad; padding-left: 14px; border-left: 1px solid #262d33; letter-spacing: 0; }
  .url { font: 500 20px "JetBrains Mono", monospace; color: #9aa5ad; }
  .body { display: grid; grid-template-columns: 1fr 440px; gap: 1px; background: #262d33; }
  .left { background: #12161a; padding: 48px 56px; display: flex; align-items: flex-end; }
  h1 { margin: 0; font-weight: 700; font-stretch: 80%; font-size: 92px; line-height: .98; letter-spacing: -.02em; max-width: 640px; }
  .right { background: #181d22; padding: 40px 36px; font: 500 24px/1.9 "JetBrains Mono", monospace; display: flex; flex-direction: column; justify-content: center; }
  .right div { display: flex; gap: 20px; }
  .right .k { color: #62b2ff; min-width: 140px; }
  .right .v { color: #e8ebed; }
</style>
</head>
<body>
<div class="frame">
  <div class="top"><div class="brand"><img id="mark" alt=""><span id="name"></span><small id="sub"></small></div><span class="url">olaryn.com</span></div>
  <div class="body">
    <div class="left"><h1 id="headline"></h1></div>
    <div class="right" id="facts"></div>
  </div>
</div>
<script>
  const cards = {
    home: { mark: "/logo-mark.svg", name: "olaryn", sub: "", headline: "Learning compounds.", facts: [["authward", "identity"], ["tallyward", "credits &amp; usage"]] },
    authward: { mark: "/assets/authward-mark.svg", name: "authward", sub: "by Olaryn", headline: "Identity your customers never see.", facts: [["grant", "authorization_code"], ["pkce", "S256"], ["tokens", "EdDSA, 15 min"]] },
    billing: { mark: "/assets/billing-mark.svg", name: "tallyward", sub: "by Olaryn", headline: "Credits reserved before work, settled after.", facts: [["reserve", "25 held"], ["settle", "19 used"], ["returned", "6"]] }
  };
  const c = cards[new URLSearchParams(location.search).get("p")] || cards.authward;
  const mark = document.getElementById("mark");
  mark.src = c.mark;
  document.getElementById("name").textContent = c.name;
  document.getElementById("sub").textContent = c.sub;
  if (!c.sub) document.getElementById("sub").remove();
  document.getElementById("headline").textContent = c.headline;
  document.getElementById("facts").innerHTML = c.facts.map(f => `<div><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join("");
</script>
</body>
</html>
